# Publishes one container image to GHCR for linux/amd64 and linux/arm64,
# then deletes its old sha- images. Called from ci.yml once the image's
# checks passed; never runs for pull requests. See
# docs/adr/0007-image-publishing.md and docs/adr/0014-server-and-frontend-images.md.
#
# Actions are pinned to commit hashes (ADR 0005); keep them in step with
# ci.yml.
name: Publish image

on:
  workflow_call:
    inputs:
      image:
        description: Package name, e.g. track-record-server
        required: true
        type: string
      context:
        description: Build context, relative to the repository root
        required: true
        type: string
      dockerfile:
        description: Dockerfile path; empty means <context>/Dockerfile
        required: false
        type: string
        default: ''
      description:
        description: org.opencontainers.image.description label
        required: true
        type: string

permissions:
  contents: read

jobs:
  push:
    name: Push to GHCR
    runs-on: ubuntu-latest
    # The server compiles Rust twice (once per platform).
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Dockerfiles build on the runner's platform and cross-compile, so
      # nothing should run emulated. QEMU is there for a RUN step in a
      # target-platform stage, which would otherwise fail on arm64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # develop -> develop; main -> main, latest; every push -> sha-<short>;
      # v1.2.3 -> 1.2.3, 1.2.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.description=${{ inputs.description }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deletes sha- images beyond the newest 10, unless they carry another tag.
  cleanup:
    name: Clean up old images
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # One cleanup per package at a time, across branches and tags.
    concurrency:
      group: ghcr-cleanup-${{ inputs.image }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete old sha- images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
        run: .github/scripts/cleanup-images.sh "$OWNER" "$IMAGE" 10
