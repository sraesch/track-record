# Continuous integration and image publishing. See docs/adr/0005-ci.md and
# docs/adr/0007-image-publishing.md.
#
# Each check job runs the same command a developer runs locally. Add a job here
# when a new part of the system gets tests. Images are published by the
# reusable workflow publish-image.yml.
#
# Actions are pinned to commit hashes because the publish job can write
# packages. The comment after each hash names its release.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ['v*']

permissions:
  contents: read

# A newer push to a pull request cancels the run of the older one. Runs on
# develop, main and tags always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run pgTAP tests
        run: db/test.sh

  database-image:
    name: Database image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and check the image
        run: db/image-test.sh

  backend:
    name: Backend tests (cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image ships rustup; make sure stable has clippy and rustfmt.
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Run fmt, clippy and tests
        run: backend/test.sh
      - name: Build the server image
        run: docker build --file backend/Dockerfile --tag track-record-server .

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run lint, type check, tests and build
        run: frontend/test.sh
      - name: Build the frontend image
        run: docker build --tag track-record-frontend frontend

  # Publishing: each image is pushed to ghcr.io/<owner>/<image> for amd64 and
  # arm64 after its own checks passed, then its old sha- images are deleted
  # (publish-image.yml). Never runs for pull requests.
  publish-database-image:
    name: Publish database image
    if: github.event_name == 'push'
    needs: [database, database-image]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: track-record-db
      context: db
      description: PostgreSQL 18 with the Track Record schema

  publish-server-image:
    name: Publish server image
    if: github.event_name == 'push'
    needs: [backend]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: track-record-server
      # The build embeds db/migrations, so the context is the repository.
      context: .
      dockerfile: backend/Dockerfile
      description: 'Track Record backend: REST API, MCP server and jobs'

  publish-frontend-image:
    name: Publish frontend image
    if: github.event_name == 'push'
    needs: [frontend]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: track-record-frontend
      context: frontend
      description: Track Record web UI
