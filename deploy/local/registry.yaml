# Image registry inside the local cluster. Docker Desktop's kind-based
# Kubernetes does not see images built with `docker build`, so up.sh pushes
# them here (through a port-forward) and the node pulls them from the
# NodePort on localhost, which containerd accepts over plain HTTP.
#
# Storage is an emptyDir: images are pushed again on every up.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: track-record-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: track-record-registry
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:3
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: track-record-registry
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
