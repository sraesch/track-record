# Web UI (frontend/Dockerfile): nginx serves the app and proxies /ui/api to
# the server's UI port. In production the ingress/auth proxy sits in front.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: localhost:30500/track-record-frontend:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: TR_UI_API_UPSTREAM, value: "http://server:8081" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
