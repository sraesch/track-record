# PostgreSQL 18 with the schema (track-record-db, ADR 0006). On first start
# with an empty volume, all migrations are applied to track_record.
apiVersion: v1
kind: Secret
metadata:
  name: db
type: Opaque
stringData:
  # Local development only.
  password: track-record-local
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: postgres
          image: localhost:30500/track-record-db:local
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db, key: password }
          ports:
            - containerPort: 5432
          # TCP comes up only after initialization (migrations) is done.
          readinessProbe:
            exec:
              command: [pg_isready, --host=127.0.0.1, --username=postgres]
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector: { app: db }
  ports:
    - port: 5432
      targetPort: 5432
