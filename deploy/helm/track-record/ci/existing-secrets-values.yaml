# Secrets and claims created outside the chart, autoscaling, scheduling.
imageTag: develop
imagePullSecrets:
  - name: ghcr
commonLabels:
  team: performance
database:
  auth:
    existingSecret: track-record-db
    secretKey: postgres-password
  persistence:
    storageClass: fast-ssd
    size: 200Gi
  resources:
    requests: {cpu: "1", memory: 2Gi}
  nodeSelector:
    kubernetes.io/os: linux
attachments:
  persistence:
    existingClaim: track-record-attachments
server:
  autoscaling:
    enabled: true
    maxReplicas: 4
  resources:
    requests: {cpu: 500m, memory: 512Mi}
  tolerations:
    - key: dedicated
      operator: Equal
      value: benchmarks
      effect: NoSchedule
networkPolicy:
  uiApiFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: auth-proxy
