{{- /*
The UI port has no authentication and carries invalidation, deletion and
token management (NFR-2): only the frontend may reach it. The machine port
is open to every peer (ingress controllers, in-cluster harnesses). The
in-cluster database accepts only the server and the migration job.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "track-record.component" (list . "server") }}
  labels:
    {{- include "track-record.componentLabels" (list . "server") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "track-record.componentSelectorLabels" (list . "server") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: machine
    - ports:
        - port: ui
      from:
        - podSelector:
            matchLabels:
              {{- include "track-record.componentSelectorLabels" (list . "frontend") | nindent 14 }}
        {{- with .Values.networkPolicy.uiApiFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if .Values.database.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "track-record.component" (list . "database") }}
  labels:
    {{- include "track-record.componentLabels" (list . "database") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "track-record.componentSelectorLabels" (list . "database") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: postgres
      from:
        - podSelector:
            matchLabels:
              {{- include "track-record.componentSelectorLabels" (list . "server") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "track-record.componentSelectorLabels" (list . "migrate") | nindent 14 }}
{{- end }}
{{- end }}
