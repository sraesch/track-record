{{- /*
Database password, when the chart manages it (no existingSecret). Kept on
uninstall: the database volume outlives the release, and a reinstall must
find the password that the database was initialized with.
*/ -}}
{{- if not (include "track-record.databaseExistingSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "track-record.component" (list . "database") }}
  labels:
    {{- include "track-record.componentLabels" (list . "database") | nindent 4 }}
  {{- if .Values.database.enabled }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  password: {{ include "track-record.databasePassword" . | b64enc | quote }}
{{- end }}
